version: "3.9"

services:
  go-training:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/go-training
    working_dir: /go-training
    command: sleep infinity
    ports:
      - "8080:8080"   
    environment:
      - GO111MODULE=on
      - CGO_ENABLED=1
      - GOPROXY=direct